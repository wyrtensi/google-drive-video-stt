[project]
name = "google-drive-video-stt"
version = "0.1.0"
description = "Monitor Google Drive folders for new MP4 files and extract MP3 audio for STT"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "google-api-python-client>=2.120.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth-httplib2>=0.2.0",
    "python-dotenv>=1.0.0",
    "requests[socks]>=2.31.0",
    "openai>=1.40.0",
    "httpx>=0.27.0",
    "PyYAML>=6.0",
]

[project.scripts]
gdstt = "src.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
# Prompt assets are package data under ``src/assets/prompts/``; ship the ``.md``
# files alongside the Python sources in the wheel.
artifacts = ["src/assets/prompts/*.md"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
